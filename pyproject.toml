[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commitkeeper"
version = "1.0.0"
description = "A local-first email agent that tracks commitments in both directions and follows up, with persistent memory."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Immad Shah" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agent", "llm", "ollama", "email", "imap", "persistent-memory", "sqlite", "productivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "openpyxl>=3.1",
    "rich>=13",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiosmtpd>=1.4"]

[project.urls]
Repository = "https://github.com/D3aThNdDeMiSe/commitkeeper"

[project.scripts]
commitkeeper = "commitkeeper.cli:main"

[tool.setuptools.packages.find]
include = ["commitkeeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
